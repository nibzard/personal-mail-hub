# Opt-in build networking for hosts whose containers cannot reach the
# configured DNS resolver (see "Build networking" in deploy/README.md).
# Merge it on the command line when a build fails to resolve names:
#
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.host-build.yml build
#
# It changes only how RUN steps reach the network while they build. It
# stays out of the default files so hermetic bridge builds keep working
# wherever container DNS answers.
services:
  api:
    build:
      network: host
  worker:
    build:
      network: host
  web:
    build:
      network: host
