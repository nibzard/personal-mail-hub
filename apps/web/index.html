<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11141b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Personal mail hub</title>
    <!-- The gateway pins this script's sha256 in its Content-Security-Policy
         (deploy/nginx-web.conf.template); editing it means re-pinning the
         hash there. apps/web/test/gateway-csp.test.ts checks the pairing. -->
    <script>
      // Apply the stored theme before first paint. Keep in sync with
      // src/theme.ts.
      (() => {
        try {
          const stored = localStorage.getItem("mailhub.theme") ?? "system";
          const dark =
            stored === "dark" ||
            (stored === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          // Without storage access, fall back to the light theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
